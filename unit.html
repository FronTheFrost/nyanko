<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥코연구소</title><link rel="stylesheet" href="style.css"></head><body>
<div id="hd"></div>
<main><p id="cnt">불러오는 중…</p><div id="app"></div></main>
<script src="common.js"></script>
<script>
let OP={tl:0,en:0,cb:0},CBSEL=new Set(),CBL=[],CBT={},CBS={q:'',c:'in'},UM=new Map(),U,u,k,f,G,B,P,D,STR=false,MODE='dps',EN=new Set(),FX={},ST={TN:false,TU:false,TL:{}},CH;
const BA=['red','floating','black','metal','angel','alien','zombie','relic','aku','traitless'],FRM=x=>`${(x/30).toFixed(2)}초`;
const pad=id=>String(id).padStart(3,'0');
const img=(src,t,fb)=>`<div class="pt">${t}<img src="${src}" ${fb?`data-f="${fb}" `:''}alt="" onerror="if(this.dataset.f){this.src=this.dataset.f;this.removeAttribute('data-f')}else this.remove()"></div>`;
const TC={red:['빨','#e8481c'],floating:['떠','#7aa04a'],black:['검','#3a3a3a'],metal:['메','#8f949b'],angel:['천','#c9b73a'],alien:['에','#4cc6b4'],zombie:['좀','#9b3fc4'],relic:['고','#6b7a2a'],aku:['악','#3b7bd4'],traitless:['무','#a9b3c6']};
const TKEY={10:'strengthen',13:'critical',50:'savage_blow',17:'wave',62:'mini_wave',56:'surge',65:'mini_surge',67:'explosion'};
const IMM=k=>/_immune$/.test(k),RES=k=>/^t(18|19|20|21|22|30|52|54)$/.test(k);

const CBN={0:'공격력',1:'체력',2:'이동 속도',14:'엄청 강하다',15:'초 데미지',16:'맷집이 좋다',18:'느리게',19:'멈춤',20:'공격력 다운',21:'공격력 업',22:'마녀 킬러',23:'사도 킬러',24:'크리티컬',25:'괴인 특효',26:'파동 무효',28:'열파 무효'};
const nameOf=m=>UM.get(m[0])?.forms[m[1]]?.name||'#'+m[0];
const cbSum=()=>{const p=Object.entries(CBT).filter(([e])=>CBN[e]).map(([e,v])=>CBN[e]+([25,26,28].includes(+e)?' 부여':' +'+v+'%'));return p.length?'· '+p.join(' · '):''};
const cbHtml=()=>`<details class="dt" id="dcb"${OP.cb?' open':''}><summary>냥콤보 <span id="cbs"></span></summary><div class="ctl"><input id="cbq" type="search" placeholder="콤보 검색" value="${esc(CBS.q)}"><select id="cbc">${[['in','이 캐릭터 포함'],['perf','캐릭터 성능'],['abil','특수 능력'],['all','전체']].map(([v,l])=>`<option value="${v}"${CBS.c===v?' selected':''}>${l}</option>`).join('')}</select></div><div id="cbl" class="cbl"></div></details>`;
function cbRows(){const q=nz(CBS.q),cat=CBS.c;
  return CBL.filter(c=>(!q||nz(c.n+c.t).includes(q))&&(cat==='all'||(cat==='in'&&c.m.some(m=>m[0]===u.id))||(cat==='perf'&&[0,1,2,27].includes(c.e))||(cat==='abil'&&c.e>=14&&c.e!==27))).map(c=>{const ok=!c.x||c.x.includes(u.id);
    return`<label class="cbr${ok?'':' off'}"><input type="checkbox" data-c="${c.id}" ${CBSEL.has(c.id)?'checked':''} ${ok?'':'disabled'}><div><b>${esc(c.n)}</b> <i>${esc(c.t)}${[17,27].includes(c.e)?' · 수치 미반영':''}${c.r?' · '+esc(c.r):''}</i><div class="mm">${c.m.map(m=>`<span class="pt mi" title="${esc(nameOf(m))}">${m[0]}<img src="img/u/${m[0]}/${m[1]-1}.png" alt="" loading="lazy" onerror="this.remove()"></span>`).join('')}</div></div></label>`}).join('')||'<p class="note">해당하는 콤보가 없어요.</p>'}
const aImg=(k,src)=>{if(TXT[k])return`<div class="pt tx${src?' '+src:''}">${TXT[k]}</div>`;const p=ip(k);return img(p[0],k,p[1]).replace('class="pt"','class="pt'+(src?' '+src:'')+'"')};
const TTID={red:33,floating:34,black:35,metal:36,angel:37,alien:38,zombie:39,relic:40,traitless:41,aku:57};
const trI=t=>{const n=ICONID[TTID[t]],s=G.trsrc[t]||'';return`<div class="ib">${img(n?`img/i/${n}.png`:`img/trait/${t}.png`,TC[t]?TC[t][0]:'',n?`img/trait/${t}.png`:'').replace('class="pt"','class="pt'+(s?' '+s:'')+'"')}<small>${esc(TR[t]||t)}</small></div>`};
const tIcon=t=>{const id=t.abilityId,k=TKEY[id]||TK[id]||'t'+id;return ICONID[id]?[`img/i/${ICONID[id]}.png`,`img/ability/${k}.png`]:ip(k)};
const ip=k=>ICON[k]?[`img/i/${ICON[k]}.png`,`img/ability/${k}.png`]:[`img/ability/${k}.png`,''];
$('#hd').innerHTML=header('');attachSuggest($('.sf input'));
(async()=>{U=await load();if(!U)return;CBL=await getC();UM=new Map(U.map(x=>[x.id,x]));
  const q=new URLSearchParams(location.search);u=U.find(x=>x.id==q.get('id'));
  if(!u){$('#cnt').textContent='없는 유닛이에요.';return}
  $('#cnt').remove();setForm(u.forms[q.get('f')]?q.get('f'):lastK(u),q.get('b'),q.get('p'))})().catch(e=>document.body.insertAdjacentHTML('afterbegin','<p style="color:#f66;padding:12px">오류: '+e.message+'</p>'));
function setForm(key,b,p){k=key;f=u.forms[k];const mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0;
  B=Math.min(mb,Math.max(1,+b||mb));P=Math.min(mp,Math.max(0,+p||0));D=f.recognitionRange;build()}
function build(){
  const mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0,ev=f.evolution||{},tl=+k>=3?(u.talents||[]):[],hasU=tl.some(t=>t.kind==='ultra');
  const mats=(ev.materials||[]).map(m=>`<span class="tag">${esc(m.name||'#'+m.itemId)} ×${m.quantity??1}</span>`).join('');
  const trow=t=>{const ti=tIcon(t);return`<div class="row tr" data-k="${tkey(t)}" data-u="${t.kind==='ultra'?1:0}"><div class="trh">${img(ti[0],'',ti[1]).replace('class="pt"','class="pt sm"')}<b>${esc(t.label)}</b>${t.kind==='ultra'?' <span class="tag r">초본능</span>':''}<span class="tv"></span></div><input type="range" min="0" max="${t.maxLevel}" value="${ST.TL[tkey(t)]??t.maxLevel}"></div>`};
  const tc=x=>`<button class="tc${EN.has(x)?' on':''}" data-e="${x}" title="${TR[x]}" style="background:${TC[x][1]}">${TC[x][0]}<img src="img/i/${ICONID[TTID[x]]}.png" alt="" onerror="this.remove()"></button>`;
  const SPT={colossus:'초생',behemoth:'초수',sage:'초현',villain:'괴',witch:'마',eva:'사'};
  const spc=x=>`<button class="tc sp${EN.has(x)?' on':''}" data-e="${x}" title="${SP[x][0]}" style="background:#4a5568">${SPT[x]}<img src="img/i/${SPID[x]}.png" alt="" onerror="this.remove()"></button>`;
  const chip=(x,l)=>`<button class="chip${EN.has(x)?' on':''}" data-e="${x}">${esc(l)}</button>`;
  document.title=`${f.name} · 냥코연구소`;
  $('#app').innerHTML=`<div class="tabs">${Object.keys(u.forms).map(x=>`<button class="tab${x===k?' on':''}" data-k="${x}">${esc(u.forms[x].name)}</button>`).join('')}</div>
<div class="hd">${img(`img/u/${u.id}/${k-1}.png`,u.id)}<div><h1>${esc(f.name)}</h1><div class="cd">#${pad(u.id)} · ${k}진</div></div></div>
<div id="tg"></div><p class="ds">${esc(f.description).replace(/\n/g,'<br>')}</p>
<h3>레벨</h3><div class="lc"><label>기본 레벨 <b id="bv"></b><input type="range" id="bs" min="1" max="${mb}" value="${B}"></label>
${mp?`<label>플러스 레벨 <b id="pv"></b><input type="range" id="ps" min="0" max="${mp}" value="${P}"></label>`:''}</div>
${tl.length?`<details class="dt" id="dtl"${OP.tl?' open':''}><summary>본능 <span id="tls"></span></summary><div class="ml"><label><input type="checkbox" id="tn" ${ST.TN?'checked':''}> 본능 적용</label>${hasU?`<label><input type="checkbox" id="tu" ${ST.TU?'checked':''}> 초본능 적용</label>`:''}</div>${tl.map(trow).join('')}</details>`:''}
<details class="dt" id="den"${OP.en?' open':''}><summary>대항 속성 <span id="ens"></span></summary><div class="chips">${BA.map(tc).join('')}</div><div class="sub2">특수 속성</div><div class="chips">${Object.keys(SP).map(spc).join('')}</div></details>
${cbHtml()}<div class="g"><div class="kv big" id="c1"></div><div class="kv big" id="c2"></div>
<div class="pn" id="dp" hidden><div class="fx" id="fx"></div>
<div class="ctl"><button class="tab" data-m="dps">실질 DPS 기댓값</button><button class="tab" data-m="atk">공격력 기댓값</button>
<label>사거리 <input type="number" id="dd" step="10" inputmode="numeric" value="${D}"></label></div>
<div id="dr"></div><div id="chart"></div>
<p class="note">사거리를 숫자로 입력하세요.</p></div>
<div style="display:contents" id="gx"></div></div>
<div id="ab"></div>${ev.xp||mats?`<h3>진화</h3><div class="row">${ev.xp?`XP ${n(ev.xp)} `:''}${mats}</div>`:''}`;
  $('#bs').oninput=e=>{B=+e.target.value;update()};
  if(mp)$('#ps').oninput=e=>{P=+e.target.value;update()};
  $('#dd').oninput=e=>{D=+e.target.value||0;mark()};
  if($('#tn'))$('#tn').onchange=e=>{ST.TN=e.target.checked;update()};
  if($('#tu'))$('#tu').onchange=e=>{ST.TU=e.target.checked;update()};
  $('#dcb').ontoggle=e=>OP.cb=e.target.open;$('#cbq').oninput=e=>{CBS.q=e.target.value;$('#cbl').innerHTML=cbRows()};$('#cbc').onchange=e=>{CBS.c=e.target.value;$('#cbl').innerHTML=cbRows()};
  $('#cbl').onchange=e=>{const c=e.target.dataset.c;if(c==null)return;e.target.checked?CBSEL.add(+c):CBSEL.delete(+c);update()};$('#cbl').innerHTML=cbRows();
  if($('#dtl'))$('#dtl').ontoggle=e=>OP.tl=e.target.open;$('#den').ontoggle=e=>OP.en=e.target.open;
  document.querySelectorAll('.tr input').forEach(i=>i.oninput=()=>{ST.TL[i.closest('.tr').dataset.k]=+i.value;update()});
  document.querySelectorAll('.tabs .tab').forEach(t=>t.onclick=()=>setForm(t.dataset.k,B,P));
  document.querySelectorAll('.chip,.tc').forEach(c=>c.onclick=()=>{const e=c.dataset.e;EN.has(e)?EN.delete(e):EN.add(e);c.classList.toggle('on');update()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;update()});
  $('#fx').onchange=e=>{const x=e.target.dataset.fx;if(x==='STR')STR=e.target.checked;else FX[x]=e.target.checked;update()};
  update()
}
function update(){
  CBT=cbTotals(CBSEL,CBL,u.id);ST.CB=CBT;G=derive(u,k,f,ST);const S=stats(f,B,P,G,CBT),mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0,A=x=>G.ab.find(a=>a.key===x),fp=f.fps||30;
  const c=mkctx(G,EN,STR,CBT),c0={...c,cc:0,sc:0},ah=A('multi_hit')?.ability_hits||null,ap=h=>!ah||ah.includes(h);
  $('#bv').textContent=`${B} / ${mb}`;if(mp)$('#pv').textContent=`+${P} / ${mp}`;
  $('#tg').innerHTML=`<span class="tag r">${esc(f.rarity)}</span>`;
  // 공격력 칸: 스위치로 켠 확률 효과는 '발동했다고 가정'
  const cr=A('critical'),sv=A('savage_blow'),sb=sv?sv.boost_percent/100:0;
  const shown=S.hits.map((h,i)=>{if(!h)return 0;const a=ap(i+1),crit=FX.critical&&cr&&a;
    return c.metal&&!crit?1:Math.round(h*c.m*c.str*(crit?2:1)*(FX.savage_blow&&sv&&a?1+sb:1))}).filter(x=>x>0);
  const extra=[];for(const[key,m,nm]of[['wave',1,'파동'],['mini_wave',.2,'소파동'],['surge',1,'열파'],['mini_surge',.2,'소열파'],['explosion',1,'폭파']])
    if(FX[key]&&A(key)){const a=A(key),lv=/surge/.test(key)?(a.level||1):1;
      extra.push(`${nm} +${n(S.hits.reduce((s,h,i)=>s+(h&&ap(i+1)?(c.metal&&!(FX.critical&&cr)?1:h*c.m*c.str*m*(FX.critical&&cr?2:1)*(FX.savage_blow&&sv?1+sb:1)):0),0)*lv)}`)}
  const nom=S.hits.reduce((s,h)=>s+(h?ehit(h,0,0,c0):0),0)/(G.cyc/fp);
  const md=x=>G.mod[x]?` mod-${G.mod[x]}`:'',rg=f.actualRanges.map(r=>`${f.actualRanges.length>1?r.hit+'타 ':''}${r.minimum}~${r.maximum}`);
  const ed=c.r<1;
  $('#c1').innerHTML=`<small>${ed?'실질 체력':'체력'}</small><b class="${md('hp').trim()}">${n(S.hp/c.r)}</b>${ed?`<div class="sub">체력 ${n(S.hp)} · 받는 피해 1/${+(1/c.r).toFixed(1)}</div>`:''}<div class="sub">히트백 ${f.knockbacks}회</div>`;
  $('#c2').innerHTML=`<small>공격력</small><button class="tgl" id="tgl">${$('#dp').hidden?'▾':'▴'}</button><b class="${md('atk').trim()}">${n(shown.reduce((a,b)=>a+b,0))}</b>
${shown.length>1?`<div class="sub">${shown.map(n).join(' + ')}</div>`:''}${extra.length?`<div class="sub">${extra.join(' · ')}</div>`:''}<div class="sub">DPS <b>${n(nom)}</b></div>`;
  $('#tgl').onclick=()=>{$('#dp').hidden=!$('#dp').hidden;$('#tgl').textContent=$('#dp').hidden?'▾':'▴'};
  const kv=(l,v,s)=>`<div class="kv"><small>${l}</small><b>${v}</b>${s?`<div class="sub">${s}</div>`:''}</div>`,fs=f.foreswingFrames||[];
  $('#gx').innerHTML=kv('공격 주기',FRM(G.cyc),`선딜 ${fs.map(FRM).join(' / ')} · 후딜 ${FRM(G.bk)} · 공격 간격 ${FRM(G.tba)}`)
   +kv('쿨타임',FRM(G.cd))+kv('인식 사거리',f.recognitionRange,`타격 범위<br>${rg.join('<br>')}`)+kv('이동속도',G.spd)+kv('코스트',n(G.cost));
  const fxs=[['critical','크리티컬'],['savage_blow','혼신의 일격'],['wave','파동'],['mini_wave','소파동'],['surge','열파'],['mini_surge','소열파'],['explosion','폭파']].filter(([x])=>A(x));
  const st=A('strengthen');
  $('#fx').innerHTML=fxs.map(([x,l])=>`<label><input type="checkbox" data-fx="${x}" ${FX[x]?'checked':''}> ${l}</label>`).join('')+(st?`<label><input type="checkbox" data-fx="STR" ${STR?'checked':''}> 공격력 업 (체력 ${st.threshold_percent}% 이하)</label>`:'');
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===MODE));
  const P0=FPof(G,EN),eff=G.ab.filter(a=>!IMM(a.key)&&!RES(a.key)),imm=G.ab.filter(a=>IMM(a.key)),res=G.ab.filter(a=>RES(a.key));
  const ic=a=>`<div class="ib ${a.src||''}" title="${esc(a.label_ko)}">${aImg(a.key,a.src)}${RES(a.key)&&a.txt?`<small>${esc(a.txt)}</small>`:''}</div>`;
  $('#ab').innerHTML=(G.tr.length?`<h3>속성 대항</h3><div class="ic">${G.tr.map(trI).join('')}</div>`:'')+(eff.length?`<h3>효과/능력</h3><div class="ag">${eff.map(a=>`<div class="ab ${a.src||''}">${aImg(a.key,a.src)}<div><b>${esc(a.label_ko)}</b>${det(a,P0,CBT)?`<i>${det(a,P0,CBT)}</i>`:''}</div></div>`).join('')}</div>`:'')
   +(imm.length?`<h3>무효</h3><div class="ic">${imm.map(ic).join('')}</div>`:'')+(res.length?`<h3>내성</h3><div class="ic">${res.map(ic).join('')}</div>`:'');
  document.querySelectorAll('.tc').forEach(b=>b.classList.toggle('mine',G.tr.includes(b.dataset.e)));
  document.querySelectorAll('.tr').forEach(r=>{const on=r.dataset.u==='1'?ST.TU:ST.TN,i=r.querySelector('input');
    r.classList.toggle('off',!on);i.disabled=!on;r.querySelector('.tv').textContent=`Lv ${i.value} / ${i.max}`});
  $('#cbs').textContent=cbSum();
  if($('#tls'))$('#tls').textContent=ST.TN||ST.TU?'· '+[ST.TN&&'본능',ST.TU&&'초본능'].filter(Boolean).join('+')+' 적용':'';
  $('#ens').textContent=EN.size?'· '+[...EN].map(x=>TR[x]||SP[x][0]).join(', '):'';
  $('#chart').innerHTML=chart(S,c);mark();
  history.replaceState(null,'',`?id=${u.id}&f=${k}&b=${B}&p=${P}`)
}
function chart(S,c){
  const W=360,H=230,L=48,R=12,T=14,Bm=28,X=rangeX(f,G),Y=rangeMin(f,G),span=X-Y||1,N=Math.min(320,span),pts=[],fp=f.fps||30,sc=MODE==='atk'?G.cyc/fp:1;
  for(let i=0;i<=N;i++){const d=X-span*i/N;pts.push([d,dps(f,G,S,d,true,c)*sc,dps(f,G,S,d,false,c)*sc])}
  const M=Math.max(1,...pts.map(p=>p[1]))*1.4,sx=d=>L+(X-d)/span*(W-L-R),sy=v=>T+(1-v/M)*(H-T-Bm);
  CH={S,c,X,Y,span,sx,sy,W,L,R,sc};
  const path=i=>pts.map((p,j)=>(j?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[i]).toFixed(1)).join('');
  let gr='';for(let i=0;i<=4;i++){const v=M*i/4,d=X-span*i/4;gr+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><line class="tk" x1="${L-4}" x2="${L}" y1="${sy(v)}" y2="${sy(v)}"/><line class="tk" x1="${sx(d)}" x2="${sx(d)}" y1="${H-Bm}" y2="${H-Bm+4}"/><text x="${L-5}" y="${sy(v)+4}" text-anchor="end">${n(v)}</text><text x="${sx(d)}" y="${H-8}" text-anchor="middle">${Math.round(d)}</text>`}
  const z=Y<0?`<line x1="${sx(0)}" x2="${sx(0)}" y1="${T}" y2="${H-Bm}" stroke="var(--line)"/>`:'';
  return`<svg id="svg" class="ch" viewBox="0 0 ${W} ${H}"><g class="gr">${gr}</g><rect class="fr" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-Bm}"/>${z}<path class="ar" d="${path(1)}L${sx(Y)} ${sy(0)}L${sx(X)} ${sy(0)}Z"/>${pts.some(p=>Math.abs(p[1]-p[2])>.5)?`<path class="ls" d="${path(2)}"/>`:''}<path class="ln" d="${path(1)}"/><line id="mk" class="mk" y1="${T}" y2="${H-Bm}"/><circle id="dot" class="dot" r="4"/></svg>`
}
function mark(){
  const a=dps(f,G,CH.S,D,true,CH.c)*CH.sc,b=dps(f,G,CH.S,D,false,CH.c)*CH.sc,x=CH.sx(Math.max(CH.Y,Math.min(D,CH.X)));
  $('#mk').setAttribute('x1',x);$('#mk').setAttribute('x2',x);$('#dot').setAttribute('cx',x);$('#dot').setAttribute('cy',CH.sy(a));
  $('#dr').innerHTML=`사거리 ${D}에서 <b>${n(a)}</b> ${MODE==='atk'?'공격력 기댓값':'실질 DPS 기댓값'}`+(Math.abs(a-b)>.5?` <i>(확률 효과 제외 ${n(b)})</i>`:'')
}
</script></body></html>
