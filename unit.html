<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥코 도감</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="bar"><a class="brand" href="index.html">냥코<span>도감</span></a><a class="back" href="index.html">← 목록</a></div></header>
<main><p id="cnt">불러오는 중…</p><div id="app"></div></main>
<script src="common.js"></script>
<script>
let U,u,k,f,B,P,D,STR=false,CH;
(async()=>{U=await load();if(!U)return;
  const q=new URLSearchParams(location.search);u=U.find(x=>x.id==q.get('id'));
  if(!u){$('#cnt').textContent='없는 유닛이에요.';return}
  $('#cnt').remove();setForm(u.forms[q.get('f')]?q.get('f'):lastK(u),q.get('b'),q.get('p'))})();
function setForm(key,b,p){k=key;f=u.forms[k];const mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0;
  B=Math.min(mb,Math.max(1,+b||mb));P=Math.min(mp,Math.max(0,+p||0));D=f.recognitionRange;build()}
const g=x=>f.abilities.find(a=>a.key===x);
const rangeX=()=>Math.max(1,...f.actualRanges.map(r=>r.maximum));
function dps(S,d,adj){
  const cr=g('critical'),sv=g('savage_blow'),mh=g('multi_hit'),st=g('strengthen'),ah=mh?mh.ability_hits:[1];
  const e=adj?1+(cr?cr.chance/100:0)+(sv?sv.chance*sv.boost_percent/1e4:0):1;
  let t=0;for(const r of f.actualRanges)if(d>=r.minimum&&d<=r.maximum)t+=(S.hits[r.hit-1]||0)*(ah.includes(r.hit)?e:1);
  if(STR&&st)t*=1+st.boost_percent/100;
  return t/sec(f)
}
function build(){
  const mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0,ev=f.evolution||{},st=g('strengthen');
  const mats=(ev.materials||[]).map(m=>`<span class="tag">${esc(m.name||'#'+m.itemId)} ×${m.quantity??1}</span>`).join('');
  const tal=(u.talents||[]).map(t=>{const np=(t.levels||[]).at(-1)?.cumulativeNp;
    return`<div class="row"><b>${esc(t.label)}</b> ${t.kind==='ultra'?'<span class="tag r">초본능</span>':''} <i>최대 Lv ${t.maxLevel}${np?` · NP ${n(np)}`:''}</i><small>${esc(t.description).replace(/\n/g,'<br>')}</small></div>`}).join('');
  document.title=`${f.name} · 냥코 도감`;
  $('#app').innerHTML=`<div class="tabs">${Object.keys(u.forms).map(x=>`<button class="tab${x===k?' on':''}" data-k="${x}">${esc(u.forms[x].name)}</button>`).join('')}</div>
<h1>#${u.id} ${esc(f.name)}</h1><span class="tag r">${esc(f.rarity)}</span>${f.traits.map(t=>`<span class="tag">${esc(TR[t]||t)}</span>`).join('')}
<p class="ds">${esc(f.description).replace(/\n/g,'<br>')}</p>
<h3>레벨</h3><div class="lc"><label>기본 레벨 <b id="bv"></b><input type="range" id="bs" min="1" max="${mb}" value="${B}"></label>
${mp?`<label>플러스 레벨 <b id="pv"></b><input type="range" id="ps" min="0" max="${mp}" value="${P}"></label>`:''}</div>
<div class="g" id="sg"></div>
<h3>DPS 계산기</h3>
<div class="ctl"><label>적 거리 <input type="number" id="dd" min="0" step="10" inputmode="numeric" value="${D}"></label>
${st?`<label><input type="checkbox" id="sk" ${STR?'checked':''}> 공격력 업 발동 (체력 ${st.threshold_percent}% 이하)</label>`:''}</div>
<div id="dr"></div><div id="chart"></div>
<p class="note">그래프를 누르거나 끌어서 거리를 바꿀 수 있어요. 크리티컬(2배)·혼신의 일격 확률은 기댓값으로 반영하고, 파동·열파 등 추가 피해와 보물·오브·본능은 제외해요.</p>
${f.abilities.length?`<h3>능력</h3>${f.abilities.map(a=>`<div class="row">${abil(a)}</div>`).join('')}`:''}
${tal?`<h3>본능</h3>${tal}`:''}
${ev.xp||mats?`<h3>진화</h3><div class="row">${ev.xp?`XP ${n(ev.xp)} `:''}${mats}</div>`:''}`;
  $('#bs').oninput=e=>{B=+e.target.value;update()};
  if(mp)$('#ps').oninput=e=>{P=+e.target.value;update()};
  $('#dd').oninput=e=>{D=Math.max(0,+e.target.value||0);mark()};
  if($('#sk'))$('#sk').onchange=e=>{STR=e.target.checked;update()};
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setForm(t.dataset.k,B,P));
  update()
}
function update(){
  const S=stats(f,B,P),mb=f.maxBaseLevel||1,mp=f.maxPlusLevel||0,kv=(l,v)=>`<div class="kv"><small>${l}</small><b>${v}</b></div>`;
  $('#bv').textContent=`${B} / ${mb}`;if(mp)$('#pv').textContent=`+${P} / ${mp}`;
  const h=S.hits.filter(x=>x>0);
  $('#sg').innerHTML=kv('체력',n(S.hp))+kv('공격력',n(S.atk)+(h.length>1?` <small style="display:inline">(${h.join('+')})</small>`:''))+kv('공격 주기',sec(f).toFixed(2)+'초')+kv('인식 사거리',f.recognitionRange)+kv('이동속도',f.speed)+kv('넉백',f.knockbacks+'회')+kv('코스트',n(f.cost))+kv('재생산',(f.cooldownFrames/(f.fps||30)).toFixed(2)+'초');
  $('#chart').innerHTML=chart(S);mark();
  history.replaceState(null,'',`?id=${u.id}&f=${k}&b=${B}&p=${P}`)
}
function chart(S){
  const W=600,H=220,L=48,R=10,T=12,Bm=26,X=rangeX(),N=Math.min(300,X),pts=[];
  for(let i=0;i<=N;i++){const d=X*i/N;pts.push([d,dps(S,d,true),dps(S,d,false)])}
  const M=Math.max(1,...pts.map(p=>p[1]))*1.1,sx=d=>L+d/X*(W-L-R),sy=v=>T+(1-v/M)*(H-T-Bm);
  CH={S,X,sx,sy,W,L,R};
  const path=i=>pts.map((p,j)=>(j?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[i]).toFixed(1)).join('');
  let gr='';for(let i=0;i<=4;i++){const v=M*i/4,d=X*i/4;gr+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-5}" y="${sy(v)+4}" text-anchor="end">${n(v)}</text><text x="${sx(d)}" y="${H-8}" text-anchor="middle">${Math.round(d)}</text>`}
  const diff=pts.some(p=>Math.abs(p[1]-p[2])>.5);
  return`<svg id="svg" class="ch" viewBox="0 0 ${W} ${H}"><g class="gr">${gr}</g><path class="ar" d="${path(1)}L${sx(X)} ${sy(0)}L${L} ${sy(0)}Z"/>${diff?`<path class="ls" d="${path(2)}"/>`:''}<path class="ln" d="${path(1)}"/><line id="mk" class="mk" y1="${T}" y2="${H-Bm}"/><circle id="dot" class="dot" r="4"/></svg>`
}
function mark(){
  const a=dps(CH.S,D,true),b=dps(CH.S,D,false),x=CH.sx(Math.min(D,CH.X));
  $('#mk').setAttribute('x1',x);$('#mk').setAttribute('x2',x);$('#dot').setAttribute('cx',x);$('#dot').setAttribute('cy',CH.sy(a));
  $('#dr').innerHTML=`거리 ${D}에서 <b>${n(a)}</b> DPS`+(Math.abs(a-b)>.5?` <i>(확률 보정 전 ${n(b)})</i>`:'')
}
const pick=e=>{const s=e.target.closest('#svg');if(!s||(e.type==='pointermove'&&!e.buttons))return;
  const r=s.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*CH.W;
  D=Math.round(Math.min(CH.X,Math.max(0,(vx-CH.L)/(CH.W-CH.L-CH.R)*CH.X)));$('#dd').value=D;mark()};
$('#app').addEventListener('pointerdown',pick);$('#app').addEventListener('pointermove',pick);
</script></body></html>
