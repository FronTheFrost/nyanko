<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥코 도감</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="bar">
        <a class="brand" href="index.html">냥코<span>도감</span></a>
        <input id="q" type="search" placeholder="이름 검색" autocomplete="off">
    </div>

    <div class="fl">
        <select id="rar"></select>
        <select id="trt"></select>
        <select id="abl"></select>

        <select id="srt">
            <option value="id">번호순</option>
            <option value="hp">체력순</option>
            <option value="atk">공격력순</option>
            <option value="dps">DPS순</option>
            <option value="rng">사거리순</option>
            <option value="cost">코스트 낮은순</option>
        </select>
    </div>
</header>

<main>
    <p id="cnt">불러오는 중…</p>
    <div id="grid"></div>
</main>

<script src="common.js"></script>

<script>

let U = [];

// 셀렉트 옵션 생성
const fill = (selector, all, arr, label) => {
    $(selector).innerHTML =
        `<option value="">${all}</option>` +
        arr.map(v =>
            `<option value="${esc(v)}">${esc(label ? label(v) : v)}</option>`
        ).join('');
};

// 캐릭터의 가장 높은 진화 형태와 능력치
const getTopStats = u => {
    const f = u.forms[lastK(u)];
    return [
        f,
        stats(f, f.maxBaseLevel || 1, 0)
    ];
};

// 데이터 로딩
async function init() {

    try {

        const response = await fetch('data/units.json');

        if (!response.ok) {
            throw new Error(
                `데이터 요청 실패: HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error('캐릭터 데이터 형식이 올바르지 않습니다.');
        }

        U = data;

        initializeFilters();

        view();

    } catch (error) {

        console.error('데이터 로딩 오류:', error);

        $('#cnt').textContent =
            `데이터를 불러오지 못했습니다: ${error.message}`;

        $('#grid').innerHTML = '';

    }
}

// 필터 초기화
function initializeFilters() {

    const forms = U.flatMap(u =>
        Object.values(u.forms)
    );

    fill(
        '#rar',
        '등급 전체',
        [...new Set(forms.map(f => f.rarity))]
    );

    fill(
        '#trt',
        '속성 전체',
        [...new Set(forms.flatMap(f => f.traits))],
        v => TR[v] || v
    );

    fill(
        '#abl',
        '능력 전체',
        [...new Set(
            forms.flatMap(f =>
                f.abilities.map(a => a.label_ko)
            )
        )].sort()
    );

    const filters = [
        '#q',
        '#rar',
        '#trt',
        '#abl',
        '#srt'
    ];

    filters.forEach(selector => {
        $(selector).addEventListener('input', view);
    });

}

// 캐릭터 검색 및 출력
function view() {

    if (!U.length) return;

    const q = $('#q').value.trim().toLowerCase();
    const rarity = $('#rar').value;
    const trait = $('#trt').value;
    const ability = $('#abl').value;
    const sort = $('#srt').value;

    // 검색 조건 적용
    const list = U.filter(u => {

        const forms = Object.values(u.forms);

        const matchName =
            !q ||
            String(u.id) === q ||
            forms.some(f =>
                f.name.toLowerCase().includes(q)
            );

        const matchRarity =
            !rarity ||
            forms.some(f => f.rarity === rarity);

        const matchTrait =
            !trait ||
            forms.some(f => f.traits.includes(trait));

        const matchAbility =
            !ability ||
            forms.some(f =>
                f.abilities.some(a =>
                    a.label_ko === ability
                )
            );

        return (
            matchName &&
            matchRarity &&
            matchTrait &&
            matchAbility
        );

    });

    // 정렬
    if (sort !== 'id') {

        const getValue = u => {

            const [f, S] = getTopStats(u);

            return {
                hp: S.hp,
                atk: S.atk,
                dps: S.dps,
                rng: f.recognitionRange,
                cost: f.cost
            }[sort];

        };

        list.sort((a, b) => {

            const A = getValue(a);
            const B = getValue(b);

            return sort === 'cost'
                ? A - B
                : B - A;

        });

    }

    // 검색 결과 표시
    $('#cnt').textContent =
        `${list.length}종 · 기본 최대 레벨 기준`;

    // 캐릭터 카드 생성
    $('#grid').innerHTML = list.map(u => {

        const [f, S] = getTopStats(u);
        const k = lastK(u);

        return `
        <a class="c" href="unit.html?id=${u.id}">

            <div class="top">

                <div class="pt">
                    ${u.id}
                    <img
                        src="img/u/${u.id}/${k-1}.png"
                        alt=""
                        loading="lazy"
                        onerror="this.remove()"
                    >
                </div>

                <div>

                    <div class="nm">
                        ${esc(f.name)}
                    </div>

                    <div class="id">
                        #${u.id} · ${esc(f.rarity)}
                    </div>

                </div>

            </div>

            <div class="st">

                <span>
                    체력 <b>${n(S.hp)}</b>
                </span>

                <span>
                    공격력 <b>${n(S.atk)}</b>
                </span>

                <span>
                    DPS <b>${S.dps ? n(S.dps) : '-'}</b>
                </span>

                <span>
                    사거리 <b>${f.recognitionRange}</b>
                </span>

            </div>

        </a>
        `;

    }).join('');

}

// 실행
init();

</script>

</body>
</html>
