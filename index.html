<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥코 도감</title>
<style>
:root{--bg:#0f141b;--card:#18202b;--line:#2a3646;--tx:#eef2f7;--mu:#93a1b5;--ac:#ff8a2b;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--line:#d9e0ea;--tx:#1a2330;--mu:#5d6b7f;--ac:#e8630a;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.bar{display:flex;gap:10px;align-items:center}
.brand{font-size:21px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}.brand span{color:var(--ac)}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
#q{flex:1}
.fl{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.fl>*{flex:0 0 auto}.fl label{font-size:13px;color:var(--mu)}
#lv{width:64px}
main{padding:10px 12px 40px;max-width:1100px;margin:auto}
#cnt{color:var(--mu);font-size:13px;margin:4px 2px 8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:150px}
.c:active,.c:hover{border-color:var(--ac)}
.top{display:flex;gap:9px;align-items:center}
.pt{position:relative;width:44px;height:44px;border-radius:9px;background:var(--line);display:grid;place-items:center;color:var(--mu);font-size:11px;flex:none;overflow:hidden}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--line)}
.nm{font-weight:800;font-size:14px;line-height:1.25}.id{color:var(--mu);font-size:11px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:8px;font-size:12px;color:var(--mu)}
.st b{color:var(--tx);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--tx);margin:3px 4px 0 0}
.tag.r{background:var(--ac);color:#111;font-weight:700}
dialog{width:min(640px,100%);max-height:90dvh;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--tx);padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.dh b{font-size:18px}.x{padding:6px 12px}
.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
.tab.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.bd{padding:4px 16px 20px}
.ds{color:var(--mu);font-size:13px;margin:6px 0 10px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--mu);font-size:11px}.kv b{font-size:17px;font-variant-numeric:tabular-nums}
h3{font-size:14px;margin:16px 0 6px;color:var(--ac)}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.row i{color:var(--mu);font-style:normal;font-size:13px}.row small{display:block;color:var(--mu);margin-top:2px}
.note{color:var(--mu);font-size:12px;margin-top:14px}
@media(min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.g{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header>
<div class="bar"><b class="brand">냥코<span>도감</span></b><input id="q" type="search" placeholder="이름 검색" autocomplete="off"></div>
<div class="fl"><select id="rar"></select><select id="trt"></select><select id="abl"></select>
<select id="srt"><option value="id">번호순</option><option value="hp">체력순</option><option value="atk">공격력순</option><option value="dps">DPS순</option><option value="rng">사거리순</option><option value="cost">코스트 낮은순</option></select>
<label>Lv <input id="lv" type="number" min="1" max="200" value="30" inputmode="numeric"></label></div>
</header>
<main><p id="cnt">불러오는 중…</p><div id="grid"></div></main>
<dialog id="dlg"></dialog>
<script>
const TR={red:'빨간 적',floating:'떠있는 적',black:'검은 적',metal:'메탈',angel:'천사',alien:'에일리언',zombie:'좀비',relic:'고대종',aku:'악마',traitless:'속성 없음',witch:'마녀',eva:'사도'};
const AF={chance:v=>`확률 ${v}%`,duration_frames:v=>`${(v/30).toFixed(1)}초`,boost_percent:v=>`+${v}%`,threshold_percent:v=>`체력 ${v}% 이하`,hit_count:v=>`${v}연타`,level:v=>`Lv ${v}`,attack_limit:v=>`${v}회 제한`,production_percent:v=>`생산 ${v}%`,attack_to_percent:v=>`공격력 ${v}%로`,dodge_chance:v=>`회피 ${v}%`,dodge_duration_frames:v=>`회피 ${(v/30).toFixed(1)}초`,damage_multiplier:v=>`피해 ${v}배`,received_damage_multiplier:v=>`받는 피해 ${v}배`,current_hp_reduction_percent:v=>`현재 체력 ${v}% 감소`};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=[],cur=[],lv=30,openU=null,openK=null;
const lastK=u=>String(Math.max(...Object.keys(u.forms)));
const mult=(L,c)=>{let p=100;for(let i=2;i<=L;i++)p+=+c[Math.min((i-1)/10|0,c.length-1)]||0;return p/100};
function stats(f){
  const L=Math.max(1,Math.min(lv,(f.maxBaseLevel||0)+(f.maxPlusLevel||0)||lv));
  const m=mult(L,f.levelCurve),hits=f.rawAttacks.filter(a=>a>0).map(a=>Math.round(a*m));
  const atk=hits.reduce((a,b)=>a+b,0),sec=f.attackCycleFrames/(f.fps||30);
  return{L,hp:Math.round(f.rawHitpoints*m),atk,hits,sec,dps:sec&&atk?atk/sec:0}
}
const n=v=>Math.round(v).toLocaleString('ko-KR');
function fill(sel,all,arr,lab){$(sel).innerHTML=`<option value="">${all}</option>`+arr.map(v=>`<option value="${esc(v)}">${esc(lab?lab(v):v)}</option>`).join('')}
function init(){
  const F=U.flatMap(u=>Object.values(u.forms));
  fill('#rar','등급 전체',[...new Set(F.map(f=>f.rarity))]);
  fill('#trt','속성 전체',[...new Set(F.flatMap(f=>f.traits))],v=>TR[v]||v);
  fill('#abl','능력 전체',[...new Set(F.flatMap(f=>f.abilities.map(a=>a.label_ko)))].sort());
  for(const id of['#q','#rar','#trt','#abl','#srt'])$(id).addEventListener('input',view);
  $('#lv').addEventListener('input',()=>{lv=Math.max(1,+$('#lv').value||1);view();if(dlg.open)show(openU,openK)});
  view()
}
function view(){
  const q=$('#q').value.trim().toLowerCase(),r=$('#rar').value,t=$('#trt').value,a=$('#abl').value,s=$('#srt').value;
  cur=U.filter(u=>{const F=Object.values(u.forms);
    return(!q||String(u.id)===q||F.some(f=>f.name.toLowerCase().includes(q)))&&(!r||F.some(f=>f.rarity===r))&&(!t||F.some(f=>f.traits.includes(t)))&&(!a||F.some(f=>f.abilities.some(x=>x.label_ko===a)))});
  const key=u=>{const f=u.forms[lastK(u)],S=stats(f);return{hp:S.hp,atk:S.atk,dps:S.dps,rng:f.recognitionRange,cost:f.cost}[s]};
  if(s!=='id'){const m=new Map(cur.map(u=>[u,key(u)]));cur.sort((x,y)=>s==='cost'?m.get(x)-m.get(y):m.get(y)-m.get(x))}
  $('#cnt').textContent=`${cur.length}종 · Lv ${lv} 기준`;
  $('#grid').innerHTML=cur.map((u,i)=>{const k=lastK(u),f=u.forms[k],S=stats(f);
    return`<div class="c" data-i="${i}"><div class="top"><div class="pt">${u.id}<img src="img/u/${u.id}/${k-1}.png" alt="" loading="lazy" onerror="this.remove()"></div><div><div class="nm">${esc(f.name)}</div><div class="id">#${u.id} · ${esc(f.rarity)}</div></div></div>
<div class="st"><span>체력 <b>${n(S.hp)}</b></span><span>공격력 <b>${n(S.atk)}</b></span><span>DPS <b>${S.dps?n(S.dps):'-'}</b></span><span>사거리 <b>${f.recognitionRange}</b></span></div></div>`}).join('')
}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.c');if(c){const u=cur[+c.dataset.i];show(u,lastK(u));dlg.showModal()}});
const dlg=$('#dlg');
dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.closest('.x'))dlg.close();const t=e.target.closest('.tab');if(t)show(openU,t.dataset.k)});
function abil(a){const x=Object.entries(a).filter(([k,v])=>AF[k]&&typeof v==='number'&&v>0).map(([k,v])=>AF[k](v));return`<b>${esc(a.label_ko)}</b>`+(x.length?` <i>${x.join(' · ')}</i>`:'')}
function show(u,k){
  openU=u;openK=k;const f=u.forms[k],S=stats(f);
  const kv=(l,v)=>`<div class="kv"><small>${l}</small><b>${v}</b></div>`;
  const ev=f.evolution||{},mats=(ev.materials||[]).map(m=>`<span class="tag">${esc(m.name||m.label||'#'+(m.id??m.itemId??'?'))} ×${m.count??m.amount??m.quantity??1}</span>`).join('');
  const tal=(u.talents||[]).map(t=>{const lastNp=(t.levels||[]).at(-1)?.cumulativeNp;
    return`<div class="row"><b>${esc(t.label)}</b> ${t.kind==='ultra'?'<span class="tag r">초본능</span>':''} <i>최대 Lv ${t.maxLevel}${lastNp?` · NP ${n(lastNp)}`:''}</i><small>${esc(t.description).replace(/\n/g,'<br>')}</small></div>`}).join('');
  dlg.innerHTML=`<div class="dh"><b>#${u.id} ${esc(f.name)}</b><button class="x">닫기</button></div>
<div class="tabs">${Object.keys(u.forms).map(x=>`<button class="tab${x===k?' on':''}" data-k="${x}">${esc(u.forms[x].name)}</button>`).join('')}</div>
<div class="bd"><span class="tag r">${esc(f.rarity)}</span>${f.traits.map(t=>`<span class="tag">${esc(TR[t]||t)}</span>`).join('')}
<p class="ds">${esc(f.description).replace(/\n/g,'<br>')}</p>
<div class="g">${kv('레벨',S.L)}${kv('체력',n(S.hp))}${kv('공격력',n(S.atk)+(S.hits.length>1?` <small>(${S.hits.join('+')})</small>`:''))}${kv('DPS',S.dps?n(S.dps):'-')}${kv('공격 주기',S.sec.toFixed(2)+'초')}${kv('사거리',f.recognitionRange)}${kv('이동속도',f.speed)}${kv('넉백',f.knockbacks+'회')}${kv('코스트',n(f.cost))}${kv('재생산',(f.cooldownFrames/(f.fps||30)).toFixed(2)+'초')}</div>
${f.abilities.length?`<h3>능력</h3>${f.abilities.map(a=>`<div class="row">${abil(a)}</div>`).join('')}`:''}
${tal?`<h3>본능</h3>${tal}`:''}
${ev.xp||mats?`<h3>진화</h3><div class="row">${ev.xp?`XP ${n(ev.xp)} `:''}${mats}</div>`:''}
<p class="note">보물·오브 효과는 반영하지 않은 기본 수치예요. 레벨은 위쪽 입력칸에서 바꿀 수 있어요.</p></div>`
}
(async()=>{
  try{const r=await fetch('data/units.json');if(!r.ok)throw new Error(r.status);U=await r.json()}
  catch(e){$('#cnt').textContent='data/units.json을 불러오지 못했어요. GitHub Pages 같은 웹 주소로 열어야 해요.';return}
  init()
})();
</script></body></html>
